[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "number-search"
version = "0.1.0"
description = "Russian license plate recognition with a versioned CNN/attention model bundle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.6,<3",
  "numpy>=2,<3",
  "Pillow>=11,<14",
  "opencv-python-headless>=4.10,<6",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18", "build>=1.6,<2"]

[project.scripts]
number-search = "number_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires the local model bundle and saved holdout images"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
